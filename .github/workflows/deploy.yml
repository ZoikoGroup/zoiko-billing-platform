name: Deploy Zoiko Billing Platform

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the job's GITHUB_TOKEN: it is only used by the VM to
# read (fetch) this repository over HTTPS during the deploy.
permissions:
  contents: read

# Never run two deploys against the VM at once (they share checkouts and the
# live html dir); a newer push waits for the in-flight deploy to finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy backend + frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_REPO: ${{ github.repository }}
          # Platform Stripe secrets (Plane 1 — Zoiko's own Stripe account).
          # Injected into the VM's backend/.env on every deploy so the running
          # backend reads them via pydantic-settings' env_file loader.
          # Never logged, echoed, or written to the git working tree.
          PLATFORM_STRIPE_SECRET_KEY: ${{ secrets.PLATFORM_STRIPE_SECRET_KEY }}
          PLATFORM_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PLATFORM_STRIPE_PUBLISHABLE_KEY }}
          PLATFORM_STRIPE_WEBHOOK_SECRET: ${{ secrets.PLATFORM_STRIPE_WEBHOOK_SECRET }}
          # Plane 2 Stripe credentials & Stripe Connect Platform Client ID.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_CLIENT_ID: ${{ secrets.STRIPE_CONNECT_CLIENT_ID }}
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: DEPLOY_GIT_TOKEN,DEPLOY_REPO,PLATFORM_STRIPE_SECRET_KEY,PLATFORM_STRIPE_PUBLISHABLE_KEY,PLATFORM_STRIPE_WEBHOOK_SECRET,STRIPE_SECRET_KEY,STRIPE_PUBLISHABLE_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_CONNECT_CLIENT_ID
          script: |
            # Fail fast on any error so a bad install/build is never reported as a success.
            set -euo pipefail

            # Optional HTTP readiness-probe port for the backend on the VM.
            # Set a GitHub Actions repository variable named BACKEND_HEALTH_PORT to enable
            # the HTTP /ready probe (e.g. 8000 or 8001). If empty, backend health is
            # verified authoritatively via `systemctl is-active`.
            BACKEND_HEALTH_PORT="${{ vars.BACKEND_HEALTH_PORT }}"

            # Bounded retry for transient install/build failures (registry/network/OOM).
            # Final failure still aborts the deployment; it never suppresses errors.
            retry() {
              local max=${1:-2}
              shift
              local n=1
              until "$@"; do
                if [ "$n" -ge "$max" ]; then
                  echo "::error::Command failed after ${n} attempt(s): $*"
                  return 1
                fi
                echo "Retrying (${n}/${max}): $*"
                n=$((n + 1))
                sleep 10
              done
            }

            # Sync a deployment checkout to origin/main deterministically. A plain
            # `git pull` merges, and fails (aborting the deploy under set -e) if the
            # checkout has drifted (untracked/modified files colliding with incoming
            # ones, a stale merge state, etc.) - it also leaves no record of what that
            # drift was. These checkouts only ever exist to mirror origin/main, so we
            # log any drift for the record, then force them back onto it and verify the
            # commit that lands is the one actually intended.
            #
            # Authentication: fetch over HTTPS with this workflow run's short-lived,
            # read-only GITHUB_TOKEN rather than an SSH deploy key stored on the VM.
            # Both SSH routes have broken in production ("git@github.com: Permission
            # denied (publickey)") - first the frontend checkout's plain
            # git@github.com origin, then the "github.com-billingbackend" alias key
            # itself - and there is no way to repair a VM-side key from CI. The token
            # is passed to git only via GIT_CONFIG_* env vars scoped to the single
            # fetch command, so it is never written to .git/config, never in git's
            # argv, and expires when this job ends. The checkout's configured origin
            # is left untouched (it is no longer used by the deploy).
            : "${DEPLOY_GIT_TOKEN:?DEPLOY_GIT_TOKEN not provided to deploy script}"
            : "${DEPLOY_REPO:?DEPLOY_REPO not provided to deploy script}"
            DEPLOY_FETCH_URL="https://github.com/${DEPLOY_REPO}.git"
            DEPLOY_AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DEPLOY_GIT_TOKEN" | base64 | tr -d '\n')"
            git_fetch_main() {
              # GIT_CONFIG_COUNT needs git >= 2.31; older git falls back to -c.
              if ! git version | awk '{split($3,v,"."); exit !(v[1]>2 || (v[1]==2 && v[2]>=31))}'; then
                GIT_TERMINAL_PROMPT=0 git -c "http.https://github.com/.extraheader=$DEPLOY_AUTH_HEADER" \
                  fetch --no-tags "$DEPLOY_FETCH_URL" "+refs/heads/main:refs/remotes/origin/main"
                return
              fi
              GIT_TERMINAL_PROMPT=0 \
              GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="$DEPLOY_AUTH_HEADER" \
                git fetch --no-tags "$DEPLOY_FETCH_URL" "+refs/heads/main:refs/remotes/origin/main"
            }
            git_sync_to_main() {
              echo "HEAD before sync: $(git rev-parse HEAD)"
              local drift
              drift="$(git status --porcelain)"
              if [ -n "$drift" ]; then
                echo "::warning::Uncommitted drift in $(pwd) before sync (will be discarded):"
                echo "$drift"
              fi
              retry 2 git_fetch_main
              git reset --hard origin/main
              local head origin_head
              head="$(git rev-parse HEAD)"
              origin_head="$(git rev-parse origin/main)"
              if [ "$head" != "$origin_head" ]; then
                echo "::error::HEAD ($head) does not match origin/main ($origin_head) after sync"
                return 1
              fi
              echo "Synced to origin/main: $head"
            }

            # =========================================================================
            # 1. BACKEND  (systemd unit: zoiko-billing-backend)
            # =========================================================================
            echo "::group::Backend deploy"
            cd /var/www/zoiko-billing-backend/app
            echo "Backend working dir: $(pwd)"
            git_sync_to_main
            cd backend
            echo "Python: $(python --version 2>&1)"
            # ── Inject Stripe configuration into backend/.env ─────────────────────
            # backend/.env is gitignored (never committed) and excluded from the
            # Docker image (.dockerignore), but it IS read by the running backend
            # process via pydantic-settings' env_file loader (see app/config.py).
            # The deploy script writes configured Stripe variables so the file
            # persists across git resets. Values come from GitHub Actions
            # repository secrets and are never echoed to the log.
            ENV_FILE="$(pwd)/.env"
            touch "$ENV_FILE"

            # Plane 1 (Platform Invoices)
            if [ -n "${PLATFORM_STRIPE_SECRET_KEY:-}" ]; then
              for KEY in PLATFORM_STRIPE_SECRET_KEY PLATFORM_STRIPE_PUBLISHABLE_KEY PLATFORM_STRIPE_WEBHOOK_SECRET; do
                sed -i "/^${KEY}=/d" "$ENV_FILE"
              done
              printf 'PLATFORM_STRIPE_SECRET_KEY=%s\n' "$PLATFORM_STRIPE_SECRET_KEY" >> "$ENV_FILE"
              printf 'PLATFORM_STRIPE_PUBLISHABLE_KEY=%s\n' "${PLATFORM_STRIPE_PUBLISHABLE_KEY:-}" >> "$ENV_FILE"
              printf 'PLATFORM_STRIPE_WEBHOOK_SECRET=%s\n' "${PLATFORM_STRIPE_WEBHOOK_SECRET:-}" >> "$ENV_FILE"
              echo "Platform Stripe secrets written to backend/.env (values redacted)"
            else
              echo "::warning::PLATFORM_STRIPE_SECRET_KEY is not set in GitHub Actions secrets; platform online payment will remain unavailable"
            fi

            # Plane 2 & Connect (Tenant Stripe Accounts)
            if [ -n "${STRIPE_CONNECT_CLIENT_ID:-}" ]; then
              sed -i "/^STRIPE_CONNECT_CLIENT_ID=/d" "$ENV_FILE"
              printf 'STRIPE_CONNECT_CLIENT_ID=%s\n' "$STRIPE_CONNECT_CLIENT_ID" >> "$ENV_FILE"
              echo "STRIPE_CONNECT_CLIENT_ID written to backend/.env"
            fi
            if [ -n "${STRIPE_SECRET_KEY:-}" ]; then
              for KEY in STRIPE_SECRET_KEY STRIPE_PUBLISHABLE_KEY STRIPE_WEBHOOK_SECRET; do
                sed -i "/^${KEY}=/d" "$ENV_FILE"
              done
              printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY" >> "$ENV_FILE"
              printf 'STRIPE_PUBLISHABLE_KEY=%s\n' "${STRIPE_PUBLISHABLE_KEY:-}" >> "$ENV_FILE"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "${STRIPE_WEBHOOK_SECRET:-}" >> "$ENV_FILE"
              echo "Plane 2 Stripe credentials written to backend/.env (values redacted)"
            fi
            chmod 600 "$ENV_FILE"
            # ─────────────────────────────────────────────────────────────────────
            source venv/bin/activate
            echo "pip: $(pip --version 2>&1)"
            retry 2 pip install -r requirements.txt
            # Apply pending schema migrations BEFORE the restart picks up new code.
            # Without this, a PR that ships a new Alembic revision deploys code that
            # expects the new schema while the database stays on the old one -- the
            # app still boots (initialize_database() only warns, not fails, on
            # missing-but-non-critical tables/columns) so /ready reports healthy
            # while any endpoint touching the new column/table 500s in production.
            # `set -euo pipefail` (top of this script) aborts the deploy here if the
            # migration fails, before the old code is ever restarted against a
            # half-migrated schema.
            echo "Alembic: $(alembic --version 2>&1)"
            alembic upgrade head
            # Phase 16 go-live rehearsal finding: a freshly migrated database
            # (new environment, disaster-recovery restore-to-empty, etc.) has
            # no commercial-plan/entitlement catalog rows, and
            # billing/routers/customer_router.py's org.entity.max entitlement
            # check 500s/403s on the very first customer-creation attempt
            # until scripts/seed_commercial_plans.py and
            # scripts/seed_entitlement_definitions.py have been run manually.
            # Both scripts are explicitly documented as idempotent ("safe to
            # run any number of times"), so running them on every deploy is a
            # no-op against an already-seeded database (existing production)
            # and closes the gap for any future fresh environment.
            python -m scripts.seed_commercial_plans
            python -m scripts.seed_entitlement_definitions
            # Public marketing-site assistant (ZB-AI-PUB-001) knowledge.
            # seed_knowledge.py is what actually loads the approved public KB
            # documents into the `billing_public` namespace and stamps each with
            # `is_public=True`. Without it the public assistant has an empty
            # reachable index, so every public question (e.g. "Explain about
            # the payments") hits the low-confidence gate and returns the
            # abstention with `evidence: []` even though the retrieval code,
            # seed flags, and is_public column are all present. It is
            # idempotent (unchanged documents are skipped by content hash), so
            # running it on every deploy is a no-op against an
            # already-seeded database and closes the gap for any fresh
            # environment. Must run AFTER `alembic upgrade head` so the
            # `ai_knowledge_document.is_public` column exists.
            python -m seed_knowledge
            deactivate
            sudo systemctl restart zoiko-billing-backend
            sudo systemctl is-active --quiet zoiko-billing-backend \
              || { echo "::error::zoiko-billing-backend unit not active after restart"; exit 1; }
            echo "systemd unit zoiko-billing-backend active: YES"
            if [ -n "$BACKEND_HEALTH_PORT" ]; then
              ready=0
              for i in 1 2 3 4 5 6; do
                if curl -fsS "http://127.0.0.1:${BACKEND_HEALTH_PORT}/ready" >/dev/null 2>&1; then
                  ready=1
                  echo "Backend HTTP /ready OK (port ${BACKEND_HEALTH_PORT})"
                  break
                fi
                echo "Waiting for backend /ready (attempt ${i}/6)..."
                sleep 5
              done
              if [ "$ready" -ne 1 ]; then
                echo "::error::Backend /ready did not return 200 after restart"
                exit 1
              fi
            else
              echo "BACKEND_HEALTH_PORT unset; backend health verified via systemctl is-active"
            fi
            echo "::endgroup::"

            # =========================================================================
            # 2. FRONTEND  (static, nginx-served under /var/www/zoiko-billing-platform/html)
            # =========================================================================
            echo "::group::Frontend deploy"
            TARGET_BASE="/var/www/zoiko-billing-platform"
            FRONTEND_DIR="$TARGET_BASE/app"
            DIST_DIR="$FRONTEND_DIR/frontend/dist"

            cd "$FRONTEND_DIR"
            echo "Frontend working dir: $(pwd)"
            git_sync_to_main
            cd frontend
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"

            # Deterministic install from the committed lockfile (package-lock.json in sync).
            retry 2 npm ci
            retry 2 npm run build

            # Verify the build produced a real, non-empty dist with an entry HTML.
            if [ ! -s "$DIST_DIR/index.html" ]; then
              echo "::error::frontend/dist/index.html is missing or empty - build produced no output"
              exit 1
            fi
            echo "frontend/dist verified: index.html present"
            echo "frontend/dist file count: $(find "$DIST_DIR" -type f | wc -l)"

            # Stage the build, then atomically swap it into the live html dir so nginx
            # never serves an empty/partial tree. Previous release retained as html.old
            # only long enough to complete the swap, then removed.
            sudo rm -rf "$TARGET_BASE/html.new"
            sudo mkdir -p "$TARGET_BASE/html.new"
            # Carry the live release's hashed assets into the new release so tabs
            # (and cached index.html) still on an older build can lazy-load their
            # chunks instead of getting index.html back ("Failed to fetch
            # dynamically imported module"). Old files are staged first, keeping
            # their original deploy time, and pruned after 14 days; the new build
            # is then copied over them, so a new file always wins and is never pruned.
            if [ -d "$TARGET_BASE/html/assets" ]; then
              sudo mkdir -p "$TARGET_BASE/html.new/assets"
              sudo cp -a "$TARGET_BASE/html/assets/." "$TARGET_BASE/html.new/assets/"
              sudo find "$TARGET_BASE/html.new/assets" -type f -mmin +20160 -delete
            fi
            sudo cp -r "$DIST_DIR/." "$TARGET_BASE/html.new/"
            sudo rm -rf "$TARGET_BASE/html.old"
            if [ -d "$TARGET_BASE/html" ]; then
              sudo mv "$TARGET_BASE/html" "$TARGET_BASE/html.old"
            fi
            sudo mv "$TARGET_BASE/html.new" "$TARGET_BASE/html"
            sudo rm -rf "$TARGET_BASE/html.old"
            sudo chown -R www-data:www-data "$TARGET_BASE/html"

            # Authoritative static-frontend health check after the swap.
            if [ ! -s "$TARGET_BASE/html/index.html" ]; then
              echo "::error::Live html/index.html missing after swap - deployment incomplete"
              exit 1
            fi
            echo "Live html verified: index.html present"
            echo "::endgroup::"

            echo "::group::Deployment summary"
            echo "Backend  : zoiko-billing-backend restarted and active"
            echo "Frontend : dist staged and swapped into $TARGET_BASE/html"
            echo "::endgroup::"
            echo "Deploy complete."
