name: Deploy Zoiko Billing Platform

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy backend + frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e

            cd /var/www/zoiko-billing-backend/app
            git pull origin main
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate
            sudo systemctl restart zoiko-billing-backend

            cd /var/www/zoiko-billing-platform/app
            git pull origin main
            cd frontend
            npm install
            npm run build
            sudo rm -rf /var/www/zoiko-billing-platform/html/*
            sudo cp -r dist/* /var/www/zoiko-billing-platform/html/
            sudo chown -R www-data:www-data /var/www/zoiko-billing-platform/html
