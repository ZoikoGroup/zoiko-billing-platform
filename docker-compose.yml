services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_DB: zoiko_billing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d zoiko_billing"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"
    volumes:
      - billing_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    # Host port matches the frontend's baked-in VITE_API_BASE_URL (frontend/.env).
    # Vite reads that value at build time, so if you change this port, update
    # frontend/.env and rebuild the frontend image to match.
    #
    # `alembic upgrade head` runs before uvicorn on every container start —
    # Postgres schema lifecycle is Alembic-managed, not create_all (see
    # docs/DATABASE_MIGRATION_GUIDE.md). Idempotent: a no-op once already
    # at head.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    environment:
      BILLING_DATABASE_URL: postgresql+psycopg://billing:billing@db:5432/zoiko_billing
      BILLING_SECRET_KEY: change-me-to-a-long-random-string
      FRONTEND_URL: http://localhost:5173
      BILLING_CORS_ORIGINS: http://localhost:5173
      # This compose file is the local development stack. Production must set
      # DEBUG=false and inject real secrets through the deployment platform.
      DEBUG: "true"
      APP_PORT: 8001
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  billing_db_data:
