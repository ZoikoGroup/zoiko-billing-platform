server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ───────────────────────────────────────────────────
    # The browser bundle is built with a SAME-ORIGIN API base (see
    # src/config/apiBase.js), so every request goes to <this-host>/api/... and
    # is forwarded to the FastAPI backend here. This is what makes login work
    # for every visitor instead of only for whoever runs the backend on their
    # own machine.
    #
    # Without this block the /api requests would fall through to the SPA
    # rewrite below and return index.html with HTTP 200, which the login page
    # would surface as "Invalid email or password" - a misleading failure that
    # looks like an auth bug but is really a missing proxy.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # Preserve the visitor's real address: the backend IP-rate-limits
        # logins and the public chatbot, and every request arriving here
        # without this would share one bucket.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: the AI assistant streams responses. Buffering
        # would hold tokens until the answer was complete, and the default
        # read timeout would cut long answers off mid-stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Assistant answers can exceed nginx's 1MB default body cap.
        client_max_body_size 25m;
    }

    # ── Static assets and entry document ───────────────────────────────────
    # Vite fingerprints everything under /assets/, so a file there never
    # changes and can be cached for a year. A missing chunk must stay a real
    # 404: falling through to the SPA rewrite below would return index.html
    # as "JavaScript" and break the dynamic import. (No `always`, so the
    # immutable header is never attached to that 404.)
    #
    # index.html (served directly, via `index`, or via the SPA rewrite, which
    # all end up here) must be revalidated so it never points at old chunks.
    #
    # add_header in a location replaces any server-level add_header; this
    # server block sets none, so nothing is dropped. Add security headers
    # here too if they are ever added at server level.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
